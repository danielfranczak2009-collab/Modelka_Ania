<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANIA — Volume XXII</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');


* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #eee6d8,
            #e7ddcc
        );

    color: #171717;

    font-family: 'Montserrat', sans-serif;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* DELIKATNA TEKSTURA CAŁEGO TŁA */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.12;

    background-image:

        repeating-linear-gradient(
            0deg,
            rgba(80,60,30,0.08) 0px,
            rgba(80,60,30,0.08) 1px,
            transparent 1px,
            transparent 4px
        );

}


/* GŁÓWNA OKŁADKA */

.cover {

    position: relative;

    width: min(92vw, 850px);

    height: min(92vh, 1100px);

    background:

        linear-gradient(
            135deg,
            #f4eee2 0%,
            #ebe2d2 50%,
            #f1e9dc 100%
        );

    box-shadow:

        0 20px 45px rgba(50,40,25,0.16),

        0 4px 12px rgba(50,40,25,0.10);

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    animation: appear 1.2s ease forwards;

}


/* RAMKA */

.cover::after {

    content: "";

    position: absolute;

    inset: 32px;

    border:

        1px solid

        rgba(40,35,25,0.18);

    pointer-events: none;

}


/* ZAWARTOŚĆ */

.cover-content {

    position: relative;

    z-index: 2;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

}


/* MAŁY NAPIS */

.edition {

    font-family: 'Montserrat', sans-serif;

    font-size: 11px;

    font-weight: 400;

    letter-spacing: 0.42em;

    margin-left: 0.42em;

    margin-bottom: 38px;

    opacity: 0.58;

}


/* ANIA */

.name {

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(70px, 11vw, 125px);

    font-weight: 400;

    letter-spacing: 0.08em;

    margin-left: 0.08em;

    line-height: 0.9;

}


/* LINIA */

.line {

    width: 55px;

    height: 1px;

    background: rgba(30,30,30,0.45);

    margin: 34px 0;

}


/* VOLUME */

.volume {

    font-family: 'Montserrat', sans-serif;

    font-size: 12px;

    letter-spacing: 0.55em;

    margin-left: 0.55em;

    opacity: 0.68;

}


/* DATA */

.date {

    position: absolute;

    bottom: 105px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 9px;

    letter-spacing: 0.35em;

    margin-left: 0.35em;

    opacity: 0.48;

}


/* PRZYCISK OPEN */

.open {

    position: absolute;

    bottom: 48px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 5;

    padding: 12px 22px;

    border: none;

    background: transparent;

    color: #171717;

    font-family: 'Montserrat', sans-serif;

    font-size: 10px;

    font-weight: 400;

    letter-spacing: 0.38em;

    margin-left: 0.38em;

    cursor: pointer;

    opacity: 0.72;

    transition:

        opacity 0.3s ease,

        letter-spacing 0.3s ease;

}


/* LINIA POD OPEN */

.open::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: 3px;

    transform: translateX(-50%);

    width: 25px;

    height: 1px;

    background: #171717;

    opacity: 0.4;

    transition:

        width 0.3s ease,

        opacity 0.3s ease;

}


.open:hover {

    opacity: 1;

    letter-spacing: 0.52em;

}


.open:hover::after {

    width: 55px;

    opacity: 0.8;

}


.open:active {

    transform:

        translateX(-50%)

        scale(0.96);

}


/* WEJŚCIE */

@keyframes appear {

    from {

        opacity: 0;

        transform: scale(0.985);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}


/* TELEFON */

@media (max-width: 600px) {

    .cover {

        width: 94vw;

        height: 94vh;

    }

    .cover::after {

        inset: 20px;

    }

    .edition {

        font-size: 8px;

        margin-bottom: 25px;

    }

    .name {

        font-size: 62px;

    }

    .volume {

        font-size: 9px;

    }

    .date {

        bottom: 95px;

    }

    .open {

        bottom: 40px;

    }

}

</style>
</head>


<body>


<div class="cover">


    <div class="cover-content">

        <div class="edition">
            A DIGITAL JOURNAL
        </div>


        <div class="name">
            ANIA
        </div>


        <div class="line"></div>


        <div class="volume">
            VOLUME XXII
        </div>

    </div>


    <div class="date">
        04 · 09 · 2026
    </div>


    <button
        class="open"
        onclick="openJournal()"
    >
        OPEN
    </button>


</div>


<script>

function openJournal() {

    const cover =
        document.querySelector(".cover");

    cover.style.transition =
        "opacity 0.8s ease, transform 0.8s ease";

    cover.style.opacity = "0";

    cover.style.transform =
        "scale(0.985)";

    setTimeout(() => {

        alert(
            "Tutaj zacznie się właściwy dziennik 📖"
        );

        cover.style.opacity = "1";

        cover.style.transform =
            "scale(1)";

    }, 800);

}

</script>


</body>
</html>
