<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANIA — Volume XXII</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');


* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    min-height: 100vh;

    overflow: hidden;

    position: relative;

    font-family: 'Montserrat', sans-serif;

    color: #17130f;

    background:

        radial-gradient(
            ellipse at center,
            #765137 0%,
            #5d3d29 45%,
            #40291d 100%
        );

}


/* =========================================================
   DREWNO — WIDOK Z GÓRY
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: -10%;

    pointer-events: none;

    background:

        repeating-linear-gradient(
            2deg,
            rgba(30, 15, 7, 0.13) 0px,
            rgba(30, 15, 7, 0.13) 2px,
            transparent 2px,
            transparent 27px
        ),

        repeating-linear-gradient(
            -1deg,
            transparent 0px,
            transparent 80px,
            rgba(255, 220, 175, 0.035) 81px,
            transparent 85px
        );

    opacity: 0.9;

}


/* =========================================================
   ŚWIATŁO Z GÓRY
========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 50% 45%,
            rgba(255, 235, 205, 0.18) 0%,
            rgba(255, 235, 205, 0.07) 38%,
            transparent 72%
        );

}


/* =========================================================
   SCENA
========================================================= */

.scene {

    position: relative;

    width: 100vw;

    height: 100vh;

}


/* =========================================================
   DZIENNIK
========================================================= */

.journal {

    position: absolute;

    z-index: 5;

    width: min(46vw, 650px);

    height: min(72vh, 850px);

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -50%)

        rotate(-1deg);

    animation:

        journalAppear 1.4s ease forwards;

}


/* =========================================================
   CIEŃ KSIĄŻKI
========================================================= */

.journal-shadow {

    position: absolute;

    z-index: 1;

    inset: 4% -3% -3% 3%;

    background:

        rgba(15, 7, 3, 0.45);

    filter: blur(25px);

    border-radius: 4px;

}


/* =========================================================
   OKŁADKA
========================================================= */

.cover {

    position: absolute;

    inset: 0;

    z-index: 3;

    background:

        linear-gradient(
            135deg,
            #f4eee2 0%,
            #e9dfce 50%,
            #f2e8d7 100%
        );

    box-shadow:

        0 15px 28px rgba(20, 10, 5, 0.25),

        0 3px 7px rgba(20, 10, 5, 0.16);

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   PAPIER
========================================================= */

.cover::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: 0.18;

    pointer-events: none;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(90,70,40,0.08) 0px,
            rgba(90,70,40,0.08) 1px,
            transparent 1px,
            transparent 5px
        ),

        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 0px,
            rgba(255,255,255,0.04) 1px,
            transparent 1px,
            transparent 7px
        );

}


/* =========================================================
   RAMKA
========================================================= */

.cover::after {

    content: "";

    position: absolute;

    inset: 30px;

    border:

        1px solid

        rgba(45,34,23,0.20);

}


/* =========================================================
   ZAWARTOŚĆ
========================================================= */

.cover-content {

    position: relative;

    z-index: 4;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

}


.edition {

    font-size: 10px;

    letter-spacing: 0.42em;

    margin-left: 0.42em;

    margin-bottom: 35px;

    opacity: 0.58;

}


.name {

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(70px, 9vw, 125px);

    font-weight: 400;

    letter-spacing: 0.09em;

    margin-left: 0.09em;

    line-height: 0.85;

}


.line {

    width: 55px;

    height: 1px;

    background:

        rgba(30,25,20,0.42);

    margin: 34px 0;

}


.volume {

    font-size: 11px;

    letter-spacing: 0.52em;

    margin-left: 0.52em;

    opacity: 0.68;

}


/* =========================================================
   DATA
========================================================= */

.date {

    position: absolute;

    z-index: 4;

    bottom: 105px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 9px;

    letter-spacing: 0.35em;

    margin-left: 0.35em;

    opacity: 0.48;

}


/* =========================================================
   OPEN
========================================================= */

.open {

    position: absolute;

    z-index: 10;

    bottom: 43px;

    left: 50%;

    transform: translateX(-50%);

    padding: 12px 22px;

    border: none;

    background: transparent;

    color: #17130f;

    font-family: 'Montserrat', sans-serif;

    font-size: 10px;

    letter-spacing: 0.38em;

    margin-left: 0.38em;

    cursor: pointer;

    opacity: 0.68;

    transition:

        opacity 0.3s ease,

        letter-spacing 0.3s ease;

}


.open::after {

    content: "";

    position: absolute;

    bottom: 3px;

    left: 50%;

    transform: translateX(-50%);

    width: 25px;

    height: 1px;

    background: #17130f;

    opacity: 0.4;

    transition:

        width 0.3s ease,

        opacity 0.3s ease;

}


.open:hover {

    opacity: 1;

    letter-spacing: 0.52em;

}


.open:hover::after {

    width: 55px;

    opacity: 0.8;

}


/* =========================================================
   FILIŻANKA — WIDOK Z GÓRY
========================================================= */

.cup {

    position: absolute;

    z-index: 8;

    left: 11%;

    top: 19%;

    width: 145px;

    height: 145px;

    animation:

        cupAppear 1.3s ease 0.3s both;

}


/* TALERZYK */

.saucer {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            #d7ccbb 0%,
            #eee6d8 55%,
            #b7a995 58%,
            #d3c6b3 68%,
            transparent 70%
        );

    filter:

        drop-shadow(
            0 12px 10px rgba(20,10,5,0.20)
        );

}


/* FILIŻANKA */

.cup-body {

    position: absolute;

    width: 100px;

    height: 100px;

    left: 22px;

    top: 22px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #f4ede1 0%,
            #ddd1bf 55%,
            #bcae9a 100%
        );

    box-shadow:

        inset 0 -8px 12px rgba(60,40,20,0.12);

}


/* KAWA */

.coffee {

    position: absolute;

    width: 72px;

    height: 72px;

    left: 14px;

    top: 14px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 38% 35%,
            #75472b 0%,
            #4a2919 55%,
            #2d170d 100%
        );

    box-shadow:

        inset 0 3px 5px rgba(255,220,180,0.12);

}


/* MAŁY REFLEKS NA KAWIE */

.coffee::after {

    content: "";

    position: absolute;

    width: 18px;

    height: 8px;

    left: 18px;

    top: 15px;

    border-radius: 50%;

    background:

        rgba(255,220,180,0.12);

    transform: rotate(-25deg);

}


/* UCHO */

.handle {

    position: absolute;

    width: 38px;

    height: 38px;

    right: -23px;

    top: 31px;

    border:

        10px solid #cfc2ae;

    border-radius: 50%;

    box-shadow:

        inset 0 0 4px rgba(60,40,20,0.12);

}


/* PARA */

.steam {

    position: absolute;

    z-index: 10;

    left: 64px;

    top: -32px;

    width: 5px;

    height: 45px;

    border-left:

        2px solid rgba(255,255,255,0.28);

    border-radius: 50%;

    filter: blur(1px);

    animation:

        steam 3s ease-in-out infinite;

}


.steam.two {

    left: 82px;

    top: -25px;

    animation-delay: 1.3s;

}


/* =========================================================
   ŚWIECZKA — WIDOK Z GÓRY
========================================================= */

.candle {

    position: absolute;

    z-index: 8;

    right: 12%;

    top: 20%;

    width: 125px;

    height: 125px;

    animation:

        candleAppear 1.4s ease 0.5s both;

}


/* POŚWIATA */

.candle-glow {

    position: absolute;

    inset: -80px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,190,100,0.14) 0%,
            rgba(255,170,80,0.06) 30%,
            transparent 70%
        );

    animation:

        glow 2s ease-in-out infinite alternate;

}


/* SŁOIK */

.candle-glass {

    position: absolute;

    width: 105px;

    height: 105px;

    left: 10px;

    top: 10px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(255,245,225,0.7),
            rgba(200,175,145,0.5)
        );

    box-shadow:

        0 12px 14px rgba(20,10,5,0.20),

        inset 0 0 12px rgba(255,255,255,0.22);

}


/* WOSK */

.wax {

    position: absolute;

    width: 80px;

    height: 80px;

    left: 12px;

    top: 12px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #f5eee1,
            #dfd1bd 70%,
            #c8b9a4
        );

}


/* KNOT */

.wick {

    position: absolute;

    z-index: 4;

    width: 4px;

    height: 14px;

    left: 61px;

    top: 47px;

    background: #3c281a;

    border-radius: 50%;

}


/* PŁOMIEŃ */

.flame {

    position: absolute;

    z-index: 10;

    left: 53px;

    top: 21px;

    width: 20px;

    height: 34px;

    border-radius:

        50% 50% 50% 50%

        / 65% 65% 35% 35%;

    background:

        radial-gradient(
            ellipse at center bottom,
            #fff8d2 0%,
            #ffd36a 35%,
            #ef8e27 70%,
            transparent 72%
        );

    filter:

        drop-shadow(
            0 0 9px rgba(255,180,70,0.7)
        );

    transform-origin: bottom center;

    animation:

        flame 0.8s ease-in-out infinite alternate;

}


/* =========================================================
   ANIMACJE
========================================================= */

@keyframes journalAppear {

    from {

        opacity: 0;

        transform:

            translate(-50%, -47%)

            rotate(-1deg)

            scale(0.97);

    }

    to {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            rotate(-1deg)

            scale(1);

    }

}


@keyframes cupAppear {

    from {

        opacity: 0;

        transform:

            translateY(20px)

            scale(0.94);

    }

    to {

        opacity: 1;

        transform:

            translateY(0)

            scale(1);

    }

}


@keyframes candleAppear {

    from {

        opacity: 0;

        transform:

            translateY(20px)

            scale(0.94);

    }

    to {

        opacity: 1;

        transform:

            translateY(0)

            scale(1);

    }

}


@keyframes flame {

    from {

        transform:

            rotate(-4deg)

            scaleY(0.95);

    }

    to {

        transform:

            rotate(5deg)

            scaleY(1.06);

    }

}


@keyframes glow {

    from {

        opacity: 0.55;

        transform: scale(0.94);

    }

    to {

        opacity: 1;

        transform: scale(1.08);

    }

}


@keyframes steam {

    0% {

        opacity: 0;

        transform:

            translateY(10px)

            translateX(0)

            scale(0.9);

    }

    30% {

        opacity: 0.6;

    }

    70% {

        opacity: 0.25;

    }

    100% {

        opacity: 0;

        transform:

            translateY(-28px)

            translateX(8px)

            scale(1.15);

    }

}


/* =========================================================
   TELEFON
========================================================= */

@media (max-width: 700px) {

    .journal {

        width: 78vw;

        height: 70vh;

    }

    .cup {

        left: 1%;

        top: 14%;

        transform: scale(0.62);

        transform-origin: top left;

    }

    .candle {

        right: 1%;

        top: 14%;

        transform: scale(0.62);

        transform-origin: top right;

    }

    .name {

        font-size: 58px;

    }

}

</style>
</head>


<body>


<div class="scene">


    <!-- =====================================================
         DZIENNIK
    ====================================================== -->

    <div class="journal">

        <div class="journal-shadow"></div>

        <div class="cover">

            <div class="cover-content">

                <div class="edition">
                    A DIGITAL JOURNAL
                </div>

                <div class="name">
                    ANIA
                </div>

                <div class="line"></div>

                <div class="volume">
                    VOLUME XXII
                </div>

            </div>


            <div class="date">
                04 · 09 · 2026
            </div>


            <button
                class="open"
                onclick="openJournal()"
            >
                OPEN
            </button>

        </div>

    </div>


    <!-- =====================================================
         FILIŻANKA
    ====================================================== -->

    <div class="cup">

        <div class="steam"></div>

        <div class="steam two"></div>

        <div class="saucer"></div>

        <div class="cup-body">

            <div class="coffee"></div>

            <div class="handle"></div>

        </div>

    </div>


    <!-- =====================================================
         ŚWIECZKA
    ====================================================== -->

    <div class="candle">

        <div class="candle-glow"></div>

        <div class="flame"></div>

        <div class="wick"></div>

        <div class="candle-glass">

            <div class="wax"></div>

        </div>

    </div>


</div>


<script>

function openJournal() {

    const journal =
        document.querySelector(".journal");

    journal.style.transition =
        "transform 0.9s ease, opacity 0.9s ease";

    journal.style.transform =
        "translate(-50%, -50%) rotate(-1deg) scale(0.96)";

    journal.style.opacity = "0";


    setTimeout(() => {

        alert(
            "Tutaj zacznie się właściwy dziennik 📖"
        );

        journal.style.transform =
            "translate(-50%, -50%) rotate(-1deg) scale(1)";

        journal.style.opacity = "1";

    }, 900);

}

</script>


</body>
</html>
